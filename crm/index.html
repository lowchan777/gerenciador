<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Leads · Além da Métrica</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leads">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --soft:#EFEEE9; --line:#E6E4DE;
  --fg:#1B211D; --fg2:#4A524D; --muted:#7A817C;
  --accent:#1E6B55; --accent-soft:#E2EEE9; --accent-ink:#134B3B;
  --wa:#1F9D55; --warn:#B4740B; --warn-soft:#FBF0DA; --bad:#B23B3B; --bad-soft:#F8E3E3; --info:#2F5FA8; --info-soft:#E3EAF6; --good:#1F7A45; --good-soft:#DFF0E5;
  --r:18px; --f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121513; --surface:#1A1E1B; --soft:#232824; --line:#2B312D;
  --fg:#ECEFEC; --fg2:#BFC6C1; --muted:#8C948F;
  --accent:#5CC29F; --accent-soft:#1E3A30; --accent-ink:#9FE0C6;
  --wa:#3CC57A; --warn:#E3A84A; --warn-soft:#3A2F1C; --bad:#E77A7A; --bad-soft:#3A2323; --info:#86A9E6; --info-soft:#1F2A3D; --good:#6FD39A; --good-soft:#1C3326;
  color-scheme:dark;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(110px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){.wrap{padding-bottom:64px}}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 22px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.02em;flex:none}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.brand h1{margin:0;font-size:18px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topr{display:flex;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.live i{width:7px;height:7px;border-radius:50%;background:var(--wa);box-shadow:0 0 0 3px color-mix(in srgb,var(--wa) 22%,transparent)}
@media(max-width:520px){.live span{display:none}}

/* botões lisos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--soft);color:var(--fg);font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:color-mix(in srgb,var(--soft) 80%,var(--fg) 8%)}
.btn.pri{background:var(--accent);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ic{width:40px;padding:0}
.btn:focus-visible,.chip:focus-visible,.row:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* filtros */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pill{position:relative;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--fg2);max-width:100%}
.pill select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.pill b{font-weight:700;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.pill.on{border-color:var(--accent);background:var(--accent-soft)}
.pill.on b{color:var(--accent-ink)}
.dates{display:flex;align-items:center;gap:8px;margin:-6px 0 18px;color:var(--muted)}
.dates input{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px}

/* agora */
.now{background:var(--surface);border-radius:var(--r);padding:20px;margin-bottom:14px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.now.alert{background:var(--accent-soft)}
.now h2{margin:0 0 4px;font-size:17px;font-weight:800;line-height:1.35}
.now p{margin:0;color:var(--fg2);font-size:14px}
.now .acts{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:560px){.now .acts{width:100%}.now .acts .btn{flex:1}}

/* resumo */
.sum{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:var(--r);margin-bottom:26px}
.sum>div{padding:18px 20px}
.sum>div+div{border-left:1px solid var(--line)}
.sum span{display:block;color:var(--muted);font-size:13px;font-weight:600}
.sum b{display:block;font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.25;margin-top:2px}
.sum em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.sum em.up{color:var(--good)} .sum em.down{color:var(--bad)}
@media(max-width:520px){.sum>div{padding:14px 12px}.sum b{font-size:21px}.sum span{font-size:12px}}

/* separadores */
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tabs button{border:0;background:transparent;height:40px;padding:0 16px;border-radius:999px;font-weight:700;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--soft);color:var(--fg2);font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.cnt.hot{background:var(--wa);color:#fff}
.tabs button[aria-selected="true"] .cnt:not(.hot){background:color-mix(in srgb,var(--bg) 25%,transparent);color:var(--bg)}
@media(max-width:899px){.tabs{display:none}}
.mnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.mnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:700;color:var(--muted);position:relative;cursor:pointer}
.mnav button svg{width:22px;height:22px}
.mnav button[aria-selected="true"]{color:var(--accent)}
.mnav .cnt{position:absolute;top:0;left:calc(50% + 6px)}
@media(min-width:900px){.mnav{display:none}}

/* lista */
.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;border:0;background:transparent;outline:0;color:var(--fg);min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 14px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
@media(min-width:900px){.chips{flex-wrap:wrap;margin:0 0 14px;padding:0}}
.chip{flex:none;height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--soft);font-size:13px;font-weight:700;color:var(--fg2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip small{font-weight:600;opacity:.65}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:color-mix(in srgb,var(--surface) 94%,var(--fg) 4%)}
.row.new{animation:flash 2.4s ease}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span .late{display:inline;color:var(--warn);font-weight:700}
.st{flex:none;display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--fg2)}
.st.s-novo{background:var(--warn-soft);color:var(--warn)}
.st.s-contactado{background:var(--info-soft);color:var(--info)}
.st.s-visita,.st.s-proposta{background:var(--accent-soft);color:var(--accent-ink)}
.st.s-fechado{background:var(--good-soft);color:var(--good)}
.st.s-numero_errado,.st.s-perdido{background:var(--soft);color:var(--muted)}
.st.s-nao_atende{background:var(--bad-soft);color:var(--bad)}
.waq{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--wa);color:#fff}
@media(max-width:520px){.row{padding:12px 14px;gap:12px}.st{height:24px;padding:0 8px;font-size:11px}}
.more{display:flex;justify-content:center;padding:14px}
.empty{background:var(--surface);border-radius:var(--r);padding:36px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* quadro */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--soft);border-radius:var(--r);padding:10px;min-height:160px}
.col.over{outline:2px dashed var(--accent)}
.col h4{margin:2px 4px 10px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.card{background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.card b{display:block;font-size:14px}
.card span{font-size:12px;color:var(--muted)}
.card.drag{opacity:.4}
.vt{margin-left:auto}

/* imóveis */
.imos{display:grid;gap:10px}
.imo{background:var(--surface);border-radius:var(--r);padding:18px 20px;cursor:pointer;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px solid transparent}
.imo.sel{border-color:var(--accent)}
.imo h3{margin:0;font-size:16px;font-weight:800}
.imo .s{font-size:12px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.imo .s i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.imo .s.on i{background:var(--wa)}
.imo dl{display:flex;gap:24px;margin:0}
.imo dl div{text-align:right}
.imo dt{font-size:12px;color:var(--muted);font-weight:600}
.imo dd{margin:0;font-weight:800;font-size:17px}
@media(max-width:520px){.imo dl{width:100%;justify-content:space-between}.imo dl div{text-align:left}}
.note{color:var(--muted);font-size:13px;margin:4px 4px 14px}

/* pendências */
.tasks{display:grid;gap:14px}
@media(min-width:700px){.tasks{grid-template-columns:1fr 1fr}}
.tcol{background:var(--surface);border-radius:var(--r);padding:18px 20px}
.tcol h3{margin:0 0 2px;font-size:16px;display:flex;gap:8px;align-items:center}
.tcol p{margin:0 0 12px;color:var(--muted);font-size:13px}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.task.done label{color:var(--muted);text-decoration:line-through}
.due{font-size:12px;color:var(--muted)} .due.late{color:var(--bad);font-weight:700}
.addt{display:flex;gap:8px;margin-top:10px}
.addt input{flex:1;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--bg);padding:0 14px;min-width:0}

/* ficha */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.38);z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;z-index:41;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  right:0;top:0;bottom:0;width:min(520px,100%);animation:slide .22s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@media(max-width:640px){.sheet{left:0;top:auto;width:100%;max-height:92vh;border-radius:22px 22px 0 0;animation:up .24s ease}@keyframes up{from{transform:translateY(40px);opacity:0}}}
.sh-h{position:sticky;top:0;z-index:2;background:var(--bg);padding:20px 20px 12px;display:flex;justify-content:space-between;gap:12px}
.sh-h h2{margin:0;font-size:20px;font-weight:800;line-height:1.25}
.sh-h small{color:var(--muted);font-size:13px;font-weight:600}
.grab{display:none;width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
@media(max-width:640px){.grab{display:block}}
.sb{padding:0 20px 28px;display:grid;gap:12px}
.box{background:var(--surface);border-radius:var(--r);padding:16px 18px}
.box h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:700}
.ct{display:flex;gap:8px;flex-wrap:wrap}
.ct button{border:0;background:var(--soft);border-radius:999px;height:34px;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.stg{display:flex;gap:6px;flex-wrap:wrap}
.stg button{border:0;height:34px;padding:0 12px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:700;color:var(--fg2);cursor:pointer}
.stg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
textarea,.inp{width:100%;min-height:120px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:12px 14px;resize:vertical;line-height:1.5}
.brow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.brow .btn.wa{flex:1}
.hint{color:var(--muted);font-size:12px;margin-top:8px}
dl.ans{margin:0;display:grid;gap:10px}
dl.ans dt{font-size:12px;color:var(--muted);font-weight:600}
dl.ans dd{margin:0;font-weight:600}
details summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:" ▾"}
details[open] summary::after{content:" ▴"}
.tl{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.tl li{font-size:13px;color:var(--fg2)}
.tl time{display:block;font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:12px 0 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* login, aviso, toast */
.login{max-width:380px;margin:12vh auto 0;padding:0 24px;display:grid;gap:14px}
.login h1{margin:8px 0 0;font-size:24px;font-weight:800}
.login label{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--fg2)}
.login input{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.demo{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
#toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:800;cursor:pointer}
@media(min-width:900px){#toast{bottom:32px}}
footer{margin-top:32px;color:var(--muted);font-size:12px;text-align:center}
.inp{min-height:0;margin-bottom:8px}
</style>
</head>

<div id="app" class="wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/*__DEMO__*/
const CFG = { url: "https://odjdqzdjfsvhxpavcdpv.supabase.co", key: "sb_publishable_t71KrNT7cYLufRjqPZIyNg_yLxh_F83" };
const STATUS = [["novo","Nova"],["contactado","Contactada"],["nao_atende","Não atende"],["visita","Visita"],["proposta","Proposta"],["fechado","Fechado"],["numero_errado","Número errado"],["perdido","Perdido"]];
const ICON = {
  spark:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>',

  search:'<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  cal:'<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',

  copy:'<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  users:'<svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>',
  check:'<svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.2l2.4 2.4 4.8-5"/></svg>',
  list:'<svg class="i" viewBox="0 0 24 24"><path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/></svg>',
  board:'<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="10" rx="1.5"/><rect x="15.5" y="4" width="5" height="13" rx="1.5"/></svg>'
};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = (n,d=2) => (n ?? 0).toLocaleString("pt-PT",{style:"currency",currency:"EUR",minimumFractionDigits:d,maximumFractionDigits:d});
const TZ = "Europe/Lisbon";
const lday = d => new Date(d).toLocaleDateString("sv-SE",{timeZone:TZ});
const addD = (s,n) => { const d=new Date(s+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const diffD = (a,b) => Math.round((new Date(b+"T12:00:00Z")-new Date(a+"T12:00:00Z"))/86400e3);
const dm = s => s.slice(8,10)+"/"+s.slice(5,7);
const hm = d => new Date(d).toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit",timeZone:TZ});
const fmtDT = d => dm(lday(d))+" às "+hm(d);
function ago(d){const m=Math.round((Date.now()-new Date(d))/60000); if(m<1)return"agora"; if(m<60)return`há ${m} min`; const h=Math.round(m/60); if(h<24)return`há ${h} h`; const dd=Math.round(h/24); return dd===1?"ontem":`há ${dd} dias`;}
function when(d){ const t=lday(Date.now()), x=lday(d); if(x===t) return "hoje, "+hm(d); if(x===addD(t,-1)) return "ontem, "+hm(d); return dm(x); }
const norm = s => String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const isPend = l => l.status==="novo" && (!S.client?.config?.since || new Date(l.created_time) >= new Date(S.client.config.since));
function initials(n){const p=String(n||"?").trim().split(/\s+/); return ((p[0]||"?")[0]+((p.length>1?p[p.length-1]:"")[0]||"")).toUpperCase();}
function avColor(n){let h=0; for(const c of String(n)) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 30% 46%)`;}

/* imóvel = conjunto de anúncios; clientes de beleza (config.vertical="beleza"): procedimento (26/11) */
const VERT = () => S.client?.config?.vertical === "beleza";
const PROC_PAD = [["Sobrancelhas","sobrancelh|brows|\\[SOB\\]|fio a fio|microblading|nanoblading"],["Eyeliner","eyeliner|delineado|olhos"],
  ["Lábios","labial|l[aá]bio|lips|boca"],["Laser","laser|remo[cç][aã]o"],["Formação","forma[cç][aã]o|forma[cç][oõ]es|curso|aluna"]];
function procOf(txts, def){ const R=S.client?.config?.procedimentos||PROC_PAD; const t=txts.filter(Boolean).join(" | ");
  for(const [lab,re] of R){ try{ if(new RegExp(re,"i").test(t)) return lab; }catch{} } return def; }
const W = t => !VERT() ? t : ({"Imóveis":"Procedimentos","Imóvel":"Procedimento","Todos os imóveis":"Todos os procedimentos","Sem imóvel":"Sem procedimento",
  "Toque num imóvel para ver só as leads dele.":"Toque num procedimento para ver só as leads dele.",
  "Experimente outro período ou outro imóvel.":"Experimente outro período ou outro procedimento.",
  "Ex.: ligou de volta, quer visita sábado":"Ex.: ligou de volta, quer marcar para sábado"}[t] || t);
function imoLabel(raw){
  if(VERT()) return raw || "Outro procedimento";
  if(!raw) return "Sem imóvel";
  const o=(S.client?.config?.imoveis)||{}; if(o[raw]) return o[raw];
  let s=String(raw); while(/^\s*\[[^\]]*\]/.test(s)) s=s.replace(/^\s*\[[^\]]*\]\s*/,"");
  s=s.split(" | ")[0].replace(/^(Apartamento|Moradia|Casa)\s+/i,"").trim();
  return s||raw;
}
const imoOfLead = l => VERT() ? procOf([l.form_name,l.adset_name,l.ad_name,l.campaign_name,...Object.values(l.answers||{})], "") : (l.adset_name || "");
const imoOfCamp = c => VERT() ? procOf([c.adset_name,c.campaign_name], "Vários procedimentos") : (c.adset_name || c.campaign_name || "");

const S = { mode:null, sb:null, user:null, isAdmin:false, clients:[], client:null, forms:{}, leads:[], camps:[], tasks:[], events:{}, tab:"leads", view:"list", filter:null, q:"", open:null, preset:"7d", from:null, to:null, imo:"", limit:60 };
try{ const v=JSON.parse(localStorage.getItem("crm_ui4")||"{}"); Object.assign(S,{view:v.view||S.view,preset:v.preset||S.preset}); if(v.preset==="custom"){S.from=v.from;S.to=v.to;} }catch{}
function keepUI(){ try{ localStorage.setItem("crm_ui4",JSON.stringify({view:S.view,preset:S.preset,from:S.from,to:S.to})); }catch{} }

function toast(t, undo){ const el=$("#toast"); el.innerHTML=`<span>${esc(t)}</span>${undo?'<button id="undo">Desfazer</button>':""}`; el.hidden=false; toast.undo=undo; clearTimeout(toast._t); toast._t=setTimeout(()=>{el.hidden=true; toast.undo=null;},4200); }
function statusLabel(k){ const o=(S.client?.config?.status_labels)||{}; return o[k] || (STATUS.find(s=>s[0]===k)||[k,k])[1]; }
const stTag = k => `<span class="st s-${esc(k)}">${esc(statusLabel(k))}</span>`;
function waDigits(l){ let d=String(l.phone_digits||l.phone||"").replace(/\D/g,""); const cc=S.client?.config?.country_code||"351"; if(d.length===9) d=cc+d; return d; }
function fmtPhone(l){ const d=waDigits(l); return d.startsWith("351")&&d.length===12?`+351 ${d.slice(3,6)} ${d.slice(6,9)} ${d.slice(9)}`:"+"+d; }
function buildMsg(l){
  const c=S.client?.config||{}; const first=(l.name||"").split(/\s+/)[0]||"";
  const subj = S.forms[l.form_id]?.subject || (c.subjects||{})[l.form_name] || l.form_name || "o seu pedido";
  const plat = /ig|insta/i.test(l.platform||"") ? "Instagram" : "Facebook";
  const out=[(c.intro||"Olá {primeiro_nome}! Recebi o seu pedido sobre {assunto}.").replace("{primeiro_nome}",first).replace("{assunto}",subj).replace("{plataforma}",plat)];
  let asked=false;
  for(const r of (c.rules||[])){ const k=Object.keys(l.answers||{}).find(k=>norm(k).includes(norm(r.question))); if(!k) continue;
    if(norm(l.answers[k]).startsWith(norm(r.answer))){ out.push(r.text); if(r.asks) asked=true; } }
  if(!asked && c.fallback) out.push(c.fallback);
  return out.join(" ");
}
const waLink = (l,msg) => `https://wa.me/${waDigits(l)}?text=${encodeURIComponent(msg ?? l.ai_whatsapp ?? buildMsg(l))}`;
function mailSubj(l){ const c=S.client?.config||{}; return l.ai_email_subject || `${S.forms[l.form_id]?.subject || l.form_name || "O seu pedido"} · ${c.brand||S.client?.name||""}`; }
function mailBody(l){ const c=S.client?.config||{}; return l.ai_email_body || `${buildMsg(l)}\n\n${c.owner_name||""}`; }
const mailLink = (l,subj,body) => `mailto:${encodeURIComponent((l.email||"").trim()).replace(/%40/g,"@")}?subject=${encodeURIComponent(subj ?? mailSubj(l))}&body=${encodeURIComponent(body ?? mailBody(l))}`;
const gmailLink = (l,subj,body) => `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent((l.email||"").trim())}&su=${encodeURIComponent(subj ?? mailSubj(l))}&body=${encodeURIComponent(body ?? mailBody(l))}`;

/* ---------- período ---------- */
const PRESETS=[["hoje","Hoje"],["ontem","Ontem"],["7d","Últimos 7 dias"],["30d","Últimos 30 dias"],["mes","Este mês"],["mesant","Mês anterior"],["tudo","Desde o início"],["custom","Escolher datas…"]];
function range(){
  const t=lday(Date.now());
  switch(S.preset){
    case "hoje": return [t,t];
    case "ontem": { const y=addD(t,-1); return [y,y]; }
    case "30d": return [addD(t,-29),t];
    case "mes": return [t.slice(0,8)+"01",t];
    case "mesant": { const f=addD(t.slice(0,8)+"01",-1); return [f.slice(0,8)+"01",f]; }
    case "tudo": { let m=t; for(const l of S.leads){ const d=lday(l.created_time); if(d<m) m=d; } for(const c of S.camps) if(c.day<m) m=c.day; return [m,t]; }
    case "custom": if(S.from&&S.to) return S.from<=S.to?[S.from,S.to]:[S.to,S.from];
    default: return [addD(t,-6),t];
  }
}
function prevRange([a,b]){
  if(S.preset==="mesant"||S.preset==="mes"){ const pf=addD(a,-1).slice(0,8)+"01"; const n=diffD(a,b); const pe=addD(pf,n); const lastPrev=addD(a,-1); return [pf, pe<lastPrev?pe:lastPrev]; }
  const n=diffD(a,b)+1; return [addD(a,-n),addD(a,-1)];
}
const leadsIn = ([a,b]) => S.leads.filter(l=>{ const d=lday(l.created_time); return d>=a&&d<=b && (!S.imo||imoOfLead(l)===S.imo); });
function campRows(){ const hasAdset=S.camps.some(c=>c.adset_id); return hasAdset?S.camps.filter(c=>c.adset_id):S.camps; }
const campsIn = ([a,b]) => campRows().filter(c=>c.day>=a&&c.day<=b && (!S.imo||imoOfCamp(c)===S.imo));
function stats(r){ const L=leadsIn(r), C=campsIn(r); const spend=C.reduce((s,c)=>s+ +c.spend,0); return {L,C,spend,leads:L.length,cpl:L.length&&C.length?spend/L.length:null,hasSpend:C.length>0}; }
function imoveis(){
  const m=new Map();
  for(const c of campRows()){ const k=imoOfCamp(c); if(!m.has(k)) m.set(k,{key:k,label:imoLabel(k),status:c.status,last:c.day}); const r=m.get(k); if(c.day>=r.last){ r.last=c.day; r.status=c.status; } }
  for(const l of S.leads){ const k=imoOfLead(l); if(!m.has(k)) m.set(k,{key:k,label:imoLabel(k),status:null,last:""}); }
  const n={}; for(const l of S.leads){ const k=imoOfLead(l); n[k]=(n[k]||0)+1; }
  return [...m.values()].map(r=>({...r,n:n[r.key]||0})).sort((a,b)=>(a.key==="")-(b.key==="")||b.n-a.n);
}

// 25/11: o Supabase devolve no máximo 1000 linhas por pedido; buscar por páginas
async function allRows(mk){ const out=[]; for(let i=0;i<50;i++){ const r=await mk().range(i*1000,i*1000+999); if(r.error) return r; out.push(...r.data); if(r.data.length<1000) break; } return {data:out,error:null}; }
async function loadLive(){
  const sb=S.sb, cid=S.client.id;
  const [f,l,c,t]=await Promise.all([
    sb.from("forms").select("form_id,name,subject").eq("client_id",cid),
    allRows(()=>sb.from("leads").select("*").eq("client_id",cid).gte("created_time",new Date(Date.now()-400*86400e3).toISOString()).order("created_time",{ascending:false}).order("id")),
    allRows(()=>sb.from("campaigns_daily").select("*").eq("client_id",cid).gte("day",lday(Date.now()-400*86400e3)).order("day").order("campaign_id").order("adset_id")),
    sb.from("tasks").select("*").eq("client_id",cid).order("due",{ascending:true})]);
  for(const r of [f,l,c,t]) if(r.error) throw r.error;
  S.forms=Object.fromEntries(f.data.map(x=>[x.form_id,x])); S.leads=l.data; S.camps=c.data; S.tasks=t.data;
  if(S.chan) sb.removeChannel(S.chan);
  S.chan=sb.channel("c-"+cid)
    .on("postgres_changes",{event:"*",schema:"public",table:"leads",filter:"client_id=eq."+cid},p=>{
      if(p.eventType==="INSERT"){ S.leads.unshift({...p.new,_new:true}); toast("Nova lead: "+(p.new.name||"")); }
      else if(p.eventType==="UPDATE"){ const i=S.leads.findIndex(x=>x.id===p.new.id); if(i>=0) S.leads[i]={...S.leads[i],...p.new}; delete S.events[p.new.id]; }
      render(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"tasks",filter:"client_id=eq."+cid},p=>{
      const i=S.tasks.findIndex(x=>x.id===p.new?.id); if(i>=0) S.tasks[i]=p.new; else if(p.new) S.tasks.push(p.new); render(); })
    .subscribe();
}
async function liveEvents(id){
  if(S.events[id]!==undefined) return; S.events[id]=null;
  const {data}=await S.sb.from("lead_events").select("*").eq("lead_id",id).order("created_at");
  S.events[id]=data||[]; render();
}
async function save(lead, patch, quiet){
  const before={}; for(const k in patch) before[k]=lead[k];
  Object.assign(lead,patch);
  if(S.mode==="demo"){ const now=new Date().toISOString(), ev=S.events[lead.id]||(S.events[lead.id]=[]);
    if(patch.status) ev.push({kind:"status",to_value:patch.status,created_at:now});
    if("notes" in patch) ev.push({kind:"note",to_value:patch.notes,created_at:now});
    if(patch.message_sent_at) ev.push({kind:"message",created_at:now});
  } else { const {error}=await S.sb.from("leads").update(patch).eq("id",lead.id);
    if(error){ Object.assign(lead,before); toast("Não gravou. Tente outra vez."); render(); return; } delete S.events[lead.id]; }
  render();
  if(patch.status && !quiet) toast(`${lead.name?.split(" ")[0]||"Lead"} → ${statusLabel(patch.status)}`, ()=>save(lead,{status:before.status},true));
}
async function saveTask(t, patch){ Object.assign(t,patch); if(S.mode==="live"){ const {error}=await S.sb.from("tasks").update(patch).eq("id",t.id); if(error) toast("Não gravou. Tente outra vez."); } render(); }
async function addTask(owner,title){
  if(S.mode==="live"){ const {data,error}=await S.sb.from("tasks").insert({client_id:S.client.id,title,owner}).select().single(); if(error){ toast("Só a Além da Métrica pode criar pendências."); return; } S.tasks.push(data); }
  else S.tasks.push({id:"t"+Date.now(),title,owner,due:null,done:false});
  render();
}

function filters(){
  const [a,b]=range(); const im=imoveis(); const pl=(PRESETS.find(p=>p[0]===S.preset)||PRESETS[2])[1];
  const pLabel=S.preset==="custom"?(a===b?dm(a):dm(a)+" – "+dm(b)):pl;
  return `<div class="filters">
    <label class="pill">${ICON.cal}<b>${esc(pLabel)}</b><select id="preset" aria-label="Período">${PRESETS.map(([k,t])=>`<option value="${k}" ${S.preset===k?"selected":""}>${t}</option>`).join("")}</select></label>
    ${im.length>1?`<label class="pill ${S.imo?"on":""}">${VERT()?ICON.spark:ICON.home}<b>${esc(S.imo?imoLabel(S.imo):W("Todos os imóveis"))}</b><select id="imo" aria-label="${W("Imóvel")}"><option value="">${W("Todos os imóveis")}</option>${im.map(r=>`<option value="${esc(r.key)}" ${S.imo===r.key?"selected":""}>${esc(r.label)} (${r.n})</option>`).join("")}</select></label>`:""}
  </div>${S.preset==="custom"?`<div class="dates"><input type="date" id="df" value="${a}" max="${lday(Date.now())}" aria-label="De"><span>até</span><input type="date" id="dt" value="${b}" max="${lday(Date.now())}" aria-label="Até"></div>`:""}`;
}
function nowCard(){
  const pend=S.leads.filter(l=>isPend(l)&&(!S.imo||imoOfLead(l)===S.imo)).sort((a,b)=>new Date(b.created_time)-new Date(a.created_time));
  const name=S.client.config?.owner_name; const h=+new Date().toLocaleString("en-GB",{hour:"2-digit",hour12:false,timeZone:TZ}); const hi=(h<12?"Bom dia":h<20?"Boa tarde":"Boa noite")+(name?", "+name:"");
  if(!pend.length) return `<section class="now"><div><h2>${esc(hi)} 👋</h2><p>Está tudo em dia. Nenhuma lead à espera de resposta.</p></div></section>`;
  const fresh=pend[0];
  return `<section class="now alert"><div><h2>${esc(hi)}. ${pend.length===1?"Tem 1 lead à espera":"Tem "+pend.length+" leads à espera"}.</h2>
    <p>A mais recente é ${esc((fresh.name||"sem nome").split(" ")[0])}, ${ago(fresh.created_time)}. Responder na primeira hora faz muita diferença.</p></div>
    <div class="acts"><a class="btn wa" href="${esc(waLink(fresh))}" target="_blank" rel="noopener" data-wa="${esc(fresh.id)}">${ICON.wa}Falar com ${esc((fresh.name||"a lead").split(" ")[0])}</a>${pend.length>1?`<button class="btn" data-f="novo">Ver todas</button>`:""}</div></section>`;
}
function summary(){
  const r=range(), c=stats(r), p=stats(prevRange(r));
  let d=""; if(p.leads>0 && S.preset!=="tudo"){ const pc=Math.round((c.leads-p.leads)/p.leads*100); d=pc===0?`<em>igual ao período anterior</em>`:`<em class="${pc>0?"up":"down"}">${pc>0?"+":"−"}${Math.abs(pc)}% vs anterior</em>`; }
  return `<section class="sum">
    <div><span>Leads</span><b>${c.leads}</b>${d}</div>
    <div><span>Custo por lead</span><b>${c.cpl!=null?eur(c.cpl):"—"}</b></div>
    <div><span>Investido</span><b>${c.hasSpend?eur(c.spend,0):"—"}</b></div>
  </section>`;
}
function filtered(){ let L=leadsIn(range()); if(S.filter) L=L.filter(l=>l.status===S.filter);
  if(S.q){ const q=norm(S.q); L=L.filter(l=>norm([l.name,l.email,l.phone,l.form_name,l.city,l.ad_name,l.adset_name,JSON.stringify(l.answers)].join(" ")).includes(q)); } return L; }
function rowHTML(l){
  const pend=isPend(l), late=pend&&Date.now()-new Date(l.created_time)>3600e3;
  const sub=S.imo?when(l.created_time):imoLabel(imoOfLead(l))+" · "+when(l.created_time);
  return `<div class="row${pend?" pend":""}${l._new?" new":""}" data-lead="${esc(l.id)}" role="button" tabindex="0" aria-label="Abrir ${esc(l.name)}">
    <span class="av" style="background:${avColor(l.name)}">${esc(initials(l.name))}</span>
    <span class="who"><b>${esc(l.name||"Sem nome")}</b><span>${late?`<span class="late">À espera ${ago(l.created_time)}</span> · ${esc(imoLabel(imoOfLead(l)))}`:esc(sub)}</span></span>
    ${pend?`<a class="waq" href="${esc(waLink(l))}" target="_blank" rel="noopener" data-wa="${esc(l.id)}" aria-label="WhatsApp ${esc(l.name)}">${ICON.wa}</a>`:l.status==="novo"?`<span class="st">${esc(statusLabel("novo"))}</span>`:stTag(l.status)}
  </div>`;
}
function leadsView(){
  const base=leadsIn(range()); const counts={}; for(const l of base) counts[l.status]=(counts[l.status]||0)+1;
  const L=filtered();
  const head=`<div class="tools"><label class="search">${ICON.search}<input id="q" type="search" placeholder="Procurar nome, telefone…" value="${esc(S.q)}" aria-label="Procurar"></label>
      <button class="btn ic" data-view="${S.view==="list"?"board":"list"}" aria-label="${S.view==="list"?"Ver em quadro":"Ver em lista"}" title="${S.view==="list"?"Quadro":"Lista"}">${S.view==="list"?ICON.board:ICON.list}</button></div>
    <div class="chips" role="group" aria-label="Filtrar por estado"><button class="chip" data-f="" aria-pressed="${!S.filter}">Todas <small>${base.length}</small></button>
    ${STATUS.filter(([k])=>counts[k]).map(([k])=>`<button class="chip" data-f="${k}" aria-pressed="${S.filter===k}">${esc(statusLabel(k))} <small>${counts[k]}</small></button>`).join("")}</div>`;
  if(!S.leads.length) return head+`<div class="empty"><b>Ainda não há leads</b>Quando entrar a primeira pelo formulário da Meta, aparece aqui na hora.</div>`;
  if(S.view==="board") return head+boardView(L);
  return head+(L.length?`<div class="list">${L.slice(0,S.limit).map(rowHTML).join("")}</div>${L.length>S.limit?`<div class="more"><button class="btn sm" id="more">Mostrar mais</button></div>`:""}`
    :`<div class="empty"><b>Nada por aqui</b>${W("Experimente outro período ou outro imóvel.")}</div>`);
}
function boardView(L){
  return `<div class="board">${STATUS.map(([k])=>{const C=L.filter(l=>l.status===k);
    return `<div class="col" data-col="${k}"><h4>${esc(statusLabel(k))}<span class="cnt">${C.length}</span></h4>
      ${C.map(l=>`<div class="card" draggable="true" data-lead="${esc(l.id)}" data-drag="${esc(l.id)}" tabindex="0"><b>${esc(l.name)}</b><span>${esc(imoLabel(imoOfLead(l)))} · ${dm(lday(l.created_time))}</span></div>`).join("")}</div>`;}).join("")}</div>`;
}
function imosView(){
  const r=range(); const rl=S.leads.filter(l=>{const d=lday(l.created_time); return d>=r[0]&&d<=r[1];}); const rc=campRows().filter(x=>x.day>=r[0]&&x.day<=r[1]);
  const rows=imoveis().map(im=>{ const spend=rc.filter(x=>imoOfCamp(x)===im.key).reduce((s,x)=>s+ +x.spend,0); const n=rl.filter(l=>imoOfLead(l)===im.key).length; return {...im,spend,leads:n}; })
    .filter(o=>o.spend>0||o.leads>0).sort((a,b)=>b.leads-a.leads||b.spend-a.spend);
  if(!rows.length) return `<div class="empty"><b>Sem atividade neste período</b>Os números das campanhas entram uma vez por dia, de manhã.</div>`;
  return `<p class="note">${W("Toque num imóvel para ver só as leads dele.")}</p><div class="imos">${rows.map(o=>`<div class="imo${S.imo===o.key?" sel":""}" data-imo="${esc(o.key)}" role="button" tabindex="0">
      <div><h3>${esc(o.label)}</h3><span class="s ${o.status==="ACTIVE"?"on":""}"><i></i>${o.status==="ACTIVE"?"Anúncio ativo":o.status?"Anúncio em pausa":"Sem anúncio"}</span></div>
      <dl><div><dt>Leads</dt><dd>${o.leads}</dd></div><div><dt>Custo por lead</dt><dd>${o.spend&&o.leads?eur(o.spend/o.leads):"—"}</dd></div><div><dt>Investido</dt><dd>${o.spend?eur(o.spend,0):"—"}</dd></div></dl>
    </div>`).join("")}</div>`;
}
function tasksView(){
  const today=lday(Date.now()); const canAdd=S.mode==="demo"||S.isAdmin;
  const col=(owner,title,sub)=>{const T=S.tasks.filter(t=>t.owner===owner).sort((a,b)=>(a.done-b.done)||String(a.due||"9").localeCompare(String(b.due||"9")));
    return `<div class="tcol"><h3>${title}<span class="cnt">${T.filter(t=>!t.done).length}</span></h3><p>${sub}</p>${T.length?T.map(t=>`<div class="task${t.done?" done":""}"><input type="checkbox" id="t-${esc(t.id)}" data-task="${esc(t.id)}" ${t.done?"checked":""}><div><label for="t-${esc(t.id)}">${esc(t.title)}</label>${t.due?`<div class="due${!t.done&&t.due<today?" late":""}">${!t.done&&t.due<today?"Atrasada · ":""}até ${dm(t.due)}</div>`:""}</div></div>`).join(""):`<div class="hint">Nada pendente.</div>`}
      ${canAdd?`<form class="addt" data-add="${owner}"><input placeholder="Nova pendência" aria-label="Nova pendência ${title}"><button class="btn sm" type="submit">Adicionar</button></form>`:""}</div>`;};
  return `<div class="tasks">${col("agencia","Da nossa parte","O que a Além da Métrica tem em mãos.")}${col("cliente","Da sua parte","O que precisamos para avançar.")}</div>`;
}
function sheet(){
  const l=S.leads.find(x=>x.id===S.open); if(!l) return "";
  if(S.mode==="live") liveEvents(l.id);
  const ev=S.events[l.id]; const msg=l._msg ?? l.ai_whatsapp ?? buildMsg(l); const msubj=l._msubj ?? mailSubj(l), mbody=l._mbody ?? mailBody(l);
  const evTxt=e=>e.kind==="status"?`Passou a <b>${esc(statusLabel(e.to_value))}</b>`:e.kind==="note"?`Nota: ${esc(e.to_value)}`:e.kind==="message"?"Abriu o WhatsApp com a mensagem":e.kind==="email"?"Abriu o e-mail com a mensagem":esc(e.to_value);
  return `<div class="scrim" data-close></div><aside class="sheet" role="dialog" aria-modal="true" aria-label="Lead ${esc(l.name)}">
    <div class="grab"></div>
    <div class="sh-h"><div><h2>${esc(l.name||"Sem nome")}</h2><small>${esc(imoLabel(imoOfLead(l)))} · ${fmtDT(l.created_time)}</small></div><button class="btn ic" data-close aria-label="Fechar">${ICON.x}</button></div>
    <div class="sb">
      <div class="box"><div class="ct"><button data-copy="${esc(fmtPhone(l))}">${esc(fmtPhone(l))}${ICON.copy}</button>${l.email?`<button data-copy="${esc(l.email)}">${esc(l.email)}${ICON.copy}</button>`:""}</div></div>
      <div class="box"><h3>Mensagem de WhatsApp</h3><textarea id="msg" aria-label="Mensagem do WhatsApp">${esc(msg)}</textarea>
        <div class="brow"><a class="btn wa" id="wa" href="${esc(waLink(l,msg))}" target="_blank" rel="noopener" data-wa="${esc(l.id)}">${ICON.wa}Abrir no WhatsApp</a><button class="btn" data-copy-msg>Copiar</button></div>
        <div class="hint">Pode mudar o texto antes de abrir.${l.status==="novo"?` Ao abrir, a lead passa a ${esc(statusLabel("contactado"))}.`:""}</div></div>
      ${l.email?`<div class="box"><h3>E-mail</h3><input id="msubj" class="inp" aria-label="Assunto do e-mail" value="${esc(msubj)}"><textarea id="mbody" aria-label="Texto do e-mail" style="min-height:150px">${esc(mbody)}</textarea>
        <div class="brow"><a class="btn" id="gm" href="${esc(gmailLink(l,msubj,mbody))}" target="_blank" rel="noopener" data-ml="${esc(l.id)}">${ICON.mail}Gmail</a><a class="btn" id="ml" href="${esc(mailLink(l,msubj,mbody))}" data-ml="${esc(l.id)}">${ICON.mail}App de e-mail</a><button class="btn" data-copy-mail>Copiar</button></div>
        <div class="hint">${l.ai_email_body?"Texto escrito pela IA para esta pessoa. ":""}Abre o seu programa de e-mail já com o texto.${l.status==="novo"?` Ao abrir, a lead passa a ${esc(statusLabel("contactado"))}.`:""}</div></div>`:""}
      <div class="box"><h3>Em que ponto está</h3><div class="stg" role="group" aria-label="Estado">${STATUS.map(([k])=>`<button data-st="${k}" aria-pressed="${l.status===k}">${esc(statusLabel(k))}</button>`).join("")}</div>
        <div class="hint">Em breve: quando marcar ${esc(statusLabel("visita"))}, ${esc(statusLabel("proposta"))} ou ${esc(statusLabel("fechado"))}, a Meta recebe essa conversão e os anúncios passam a procurar pessoas parecidas.${l.capi_sent_at?" Conversão enviada.":""}</div></div>
      <div class="box"><h3>O que respondeu</h3><dl class="ans">${Object.entries(l.answers||{}).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")||'<div class="hint">Sem respostas extra.</div>'}</dl></div>
      <div class="box"><h3>Notas</h3><textarea id="notes" style="min-height:84px" placeholder=W("Ex.: ligou de volta, quer visita sábado")>${esc(l.notes||"")}</textarea><div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn sm pri" id="savenote">Guardar nota</button></div></div>
      <div class="box"><details><summary>Detalhes e histórico</summary>
        <dl class="kv">${l.form_name?`<dt>Formulário</dt><dd>${esc(l.form_name)}</dd>`:""}${l.ad_name?`<dt>Anúncio</dt><dd>${esc(l.ad_name)}</dd>`:""}${l.city?`<dt>Cidade</dt><dd>${esc(l.city)}</dd>`:""}<dt>Origem</dt><dd>${/ig|insta/i.test(l.platform||"")?"Instagram":"Facebook"}</dd></dl>
        ${ev?`<ul class="tl">${ev.slice().reverse().map(e=>`<li><time>${fmtDT(e.created_at)}${e.who?" · "+esc(e.who):""}</time>${evTxt(e)}</li>`).join("")}</ul>`:'<div class="hint">A carregar…</div>'}</details></div>
    </div></aside>`;
}
function render(){
  const app=$("#app");
  if(S.mode==="login"){ app.innerHTML=`<form class="login" id="login"><span class="mark">AM</span><div><h1>Painel de leads</h1><div class="hint">Além da Métrica</div></div>
      <label>E-mail<input id="em" type="email" autocomplete="username" required></label>
      <label>Senha<input id="pw" type="password" autocomplete="current-password" required></label>
      <button class="btn pri" type="submit">Entrar</button><div class="err" id="err"></div>
      <div class="hint">Os dados ficam em servidores na União Europeia. Só quem tem acesso a este cliente os vê.</div></form>`; return; }
  const c=S.client; const qFocus=document.activeElement?.id==="q"; const sy=window.scrollY;
  const novos=S.leads.filter(l=>isPend(l)&&(!S.imo||imoOfLead(l)===S.imo)).length, tOpen=S.tasks.filter(t=>!t.done).length;
  const tabs=[["leads","Leads",ICON.users,novos],["imos",W("Imóveis"),VERT()?ICON.spark:ICON.home,0],["tasks","Pendências",ICON.check,tOpen]];
  app.innerHTML=`${S.mode==="demo"?`<div class="demo"><span>Pré-visualização com dados fictícios</span></div>`:""}
    <header class="top"><div class="brand"><span class="mark">${esc(initials(c.config?.brand||c.name))}</span><div style="min-width:0"><small>Painel de leads</small><h1>${esc(c.config?.brand||c.name)}</h1></div></div>
      <div class="topr"><span class="live"><i></i><span>Ao vivo</span></span>
      ${S.isAdmin&&S.clients.length>1?`<select class="btn sm" id="cli" aria-label="Cliente">${S.clients.map(x=>`<option value="${esc(x.slug)}" ${x.id===c.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`:""}
      ${S.mode==="live"?`<button class="btn sm ghost" id="out">Sair</button>`:""}</div></header>
    ${filters()}
    ${nowCard()}
    ${summary()}
    <div class="tabs" role="tablist">${tabs.map(([k,t,ic,b])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${t}${b?`<span class="cnt ${k==="leads"?"hot":""}">${b}</span>`:""}</button>`).join("")}</div>
    <section>${S.tab==="leads"?leadsView():S.tab==="imos"?imosView():tasksView()}</section>
    <footer>As leads chegam dos formulários da Meta no momento em que entram · dados na UE</footer>
    <nav class="mnav" role="tablist">${tabs.map(([k,t,ic,b])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${ic}${t}${b?`<span class="cnt ${k==="leads"?"hot":""}">${b}</span>`:""}</button>`).join("")}</nav>
    ${sheet()}`;
  S.leads.forEach(l=>delete l._new);
  if(qFocus){ const q=$("#q"); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length);} }
  window.scrollTo(0,sy);
  document.body.style.overflow=S.open?"hidden":"";
}

/* ---------- eventos ---------- */
document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-wa],[data-f],[data-lead],[data-close],[data-st],[data-tab],[data-imo],[data-view],[data-copy],[data-copy-msg],[data-ml],[data-copy-mail],#savenote,#out,#undo,#more");
  if(!t) return;
  if(t.dataset.ml){ e.stopPropagation(); const l=S.leads.find(x=>x.id===t.dataset.ml); t.href=(t.id==="gm"?gmailLink:mailLink)(l,$("#msubj").value,$("#mbody").value);
    const patch={email_sent_at:new Date().toISOString()}; if(l.status==="novo") patch.status="contactado"; setTimeout(()=>save(l,patch),50); return; }
  if(t.dataset.wa){ e.stopPropagation(); const l=S.leads.find(x=>x.id===t.dataset.wa); if(t.id==="wa") t.href=waLink(l,$("#msg").value);
    const patch={message_sent_at:new Date().toISOString()}; if(l.status==="novo") patch.status="contactado"; setTimeout(()=>save(l,patch),50); return; }
  if(t.id==="undo"){ const u=toast.undo; $("#toast").hidden=true; if(u) u(); return; }
  if(t.id==="more"){ S.limit+=60; render(); return; }
  if(t.dataset.f!==undefined){ S.filter=t.dataset.f||null; S.limit=60; S.tab="leads"; if(t.dataset.f==="novo"&&t.classList.contains("btn")){ S.preset="tudo"; S.view="list"; } render(); return; }
  if(t.dataset.imo!==undefined){ S.imo=S.imo===t.dataset.imo?"":t.dataset.imo; S.limit=60; S.tab="leads"; render(); window.scrollTo(0,0); return; }
  if(t.dataset.lead){ if(S.dragging) return; S.open=t.dataset.lead; render(); return; }
  if(t.dataset.close!==undefined){ S.open=null; render(); return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(t.dataset.view){ S.view=t.dataset.view; keepUI(); render(); return; }
  if(t.dataset.st){ const l=S.leads.find(x=>x.id===S.open); if(l.status!==t.dataset.st) save(l,{status:t.dataset.st}); return; }
  if(t.dataset.copyMail!==undefined){ try{ await navigator.clipboard.writeText($("#msubj").value+"\n\n"+$("#mbody").value); toast("Copiado"); }catch{ toast("Não deu para copiar aqui."); } return; }
  if(t.dataset.copy!==undefined||t.dataset.copyMsg!==undefined){ const v=t.dataset.copy??$("#msg").value; try{ await navigator.clipboard.writeText(v); toast("Copiado"); }catch{ toast("Não deu para copiar aqui."); } return; }
  if(t.id==="savenote"){ const l=S.leads.find(x=>x.id===S.open); await save(l,{notes:$("#notes").value}); toast("Nota guardada"); }
  else if(t.id==="out"){ await S.sb.auth.signOut(); location.reload(); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"&&S.open){ S.open=null; render(); }
  if(e.key==="Enter"&&(e.target.dataset?.lead||e.target.dataset?.imo!==undefined)&&!e.target.closest("a")) e.target.click();
});
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ S.q=e.target.value; S.limit=60; render(); }
  if(e.target.id==="msg"){ const l=S.leads.find(x=>x.id===S.open); if(l) l._msg=e.target.value; }
  if(e.target.id==="msubj"||e.target.id==="mbody"){ const l=S.leads.find(x=>x.id===S.open); if(l){ l._msubj=$("#msubj").value; l._mbody=$("#mbody").value; const a=$("#ml"); if(a) a.href=mailLink(l,l._msubj,l._mbody); const g=$("#gm"); if(g) g.href=gmailLink(l,l._msubj,l._mbody); } }
});
document.addEventListener("change", e=>{
  if(e.target.dataset.task){ const t=S.tasks.find(x=>String(x.id)===e.target.dataset.task); saveTask(t,{done:e.target.checked,done_at:e.target.checked?new Date().toISOString():null}); }
  if(e.target.id==="cli"){ location.hash=e.target.value; }
  if(e.target.id==="preset"){ const v=e.target.value; if(v==="custom"&&S.preset!=="custom"){ const [a,b]=range(); S.from=a; S.to=b; } S.preset=v; S.limit=60; keepUI(); render(); }
  if(e.target.id==="imo"){ S.imo=e.target.value; S.limit=60; render(); }
  if(e.target.id==="df"||e.target.id==="dt"){ const [a,b]=range(); S.from=$("#df").value||a; S.to=$("#dt").value||b; S.preset="custom"; S.limit=60; keepUI(); render(); }
});
document.addEventListener("submit", async e=>{
  if(e.target.dataset.add){ e.preventDefault(); const v=e.target.querySelector("input").value.trim(); if(v) addTask(e.target.dataset.add,v); return; }
  if(e.target.id!=="login") return; e.preventDefault();
  const {error}=await S.sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  if(error){ $("#err").textContent="E-mail ou senha errados. Se esqueceu a senha, fale com a Além da Métrica."; return; }
  boot();
});
document.addEventListener("dragstart", e=>{ const c=e.target.closest?.("[data-drag]"); if(!c) return; S.dragging=c.dataset.drag; c.classList.add("drag"); e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",c.dataset.drag); });
document.addEventListener("dragend", e=>{ e.target.classList?.remove("drag"); setTimeout(()=>S.dragging=null,0); document.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over")); });
document.addEventListener("dragover", e=>{ const col=e.target.closest?.("[data-col]"); if(!col) return; e.preventDefault(); document.querySelectorAll(".col.over").forEach(x=>x!==col&&x.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("drop", e=>{ const col=e.target.closest?.("[data-col]"); if(!col) return; e.preventDefault(); const id=e.dataTransfer.getData("text/plain"); const l=S.leads.find(x=>x.id===id); S.dragging=null; if(l&&l.status!==col.dataset.col) save(l,{status:col.dataset.col}); else render(); });
window.addEventListener("hashchange",()=>{ if(S.mode==="live") pickClient().then(render); });

async function pickClient(){ const slug=location.hash.replace(/^#/,""); S.client=S.clients.find(c=>c.slug===slug)||S.clients[0]; S.events={}; S.open=null; S.filter=null; S.imo=""; await loadLive(); }
async function boot(){
  if(typeof DEMO_DATA!=="undefined"){ S.mode="demo"; loadDemo(); render(); return; }
  S.sb=supabase.createClient(CFG.url,CFG.key);
  const {data:{session}}=await S.sb.auth.getSession();
  if(!session){ S.mode="login"; render(); return; }
  S.user=session.user;
  const [{data:adm},{data:cl}]=await Promise.all([S.sb.from("admins").select("user_id").eq("user_id",S.user.id),S.sb.from("clients").select("id,name,slug,config,active").order("active",{ascending:false}).order("name")]);
  S.isAdmin=!!(adm&&adm.length); S.clients=cl||[];
  if(!S.clients.length){ S.mode="login"; render(); $("#err").textContent="Esta conta ainda não tem nenhum cliente associado."; return; }
  S.mode="live"; await pickClient(); render();
}
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
boot().catch(err=>{ $("#app").innerHTML=`<div class="empty"><b>Não foi possível abrir o painel</b>${esc(err.message||err)}</div>`; });
</script>
<script src="i18n.js?v=1"></script>
</body></html>
