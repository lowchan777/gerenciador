<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gerenciador · Além da Métrica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f2f5;--panel:#fff;--line:#dadde1;--line2:#e9ebee;--ink:#1c1e21;--ink2:#606770;--ink3:#8a8d91;
  --blue:#1877f2;--blue2:#e7f0fd;--blueh:#166fe5;--green:#31a24c;--green2:#e6f4ea;--red:#e41e3f;--red2:#fdecee;
  --amber:#f7b928;--draft:#fff8e1;--draftline:#f7b928;--sel:#eaf3ff;--hover:#f5f6f7;--shadow:0 2px 12px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.35 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}

/* login */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50}
#login form{background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px;width:min(360px,calc(100vw - 32px));box-shadow:var(--shadow)}
#login h1{font-size:18px;margin:0 0 4px}#login p{margin:0 0 18px;color:var(--ink2)}
#login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
#login .err{color:var(--red);min-height:18px;font-size:12px}

/* app shell */
#app{display:flex;flex-direction:column;height:100vh}
.top{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#1877f2,#31a24c);display:inline-block}
.acct{position:relative}
.acctbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;min-width:240px;max-width:360px}
.acctbtn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acctbtn small{color:var(--ink3)}
.caret{margin-left:auto;border:4px solid transparent;border-top-color:var(--ink2);margin-top:4px}
.spacer{flex:1}
.sync{color:var(--ink3);font-size:12px;white-space:nowrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blueh)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.badge{background:#fff;color:var(--green);border-radius:10px;padding:0 6px;font-size:11px;font-weight:700}
.main{flex:1;display:flex;flex-direction:column;min-height:0;padding:12px 16px 0}

/* tabs */
.tabs{display:flex;background:#fff;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0}
.tab{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;border-right:1px solid var(--line2);border-bottom:3px solid transparent;font-weight:600;color:var(--ink2)}
.tab svg{flex:none}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);background:#fff}
.tab .chip{margin-left:auto;font-weight:500;font-size:11px;background:var(--blue2);color:var(--blue);border-radius:10px;padding:1px 8px;display:flex;gap:4px;align-items:center}
.tab .chip u{text-decoration:none;cursor:pointer;font-weight:700}

/* toolbar */
.bar{background:#fff;border:1px solid var(--line);border-top:1px solid var(--line2);display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;min-width:220px;flex:1;max-width:420px}
.search input{border:none;outline:none;flex:1;min-width:0}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;background:#fff;font-size:12px}
.pill.on{background:var(--blue2);border-color:var(--blue);color:var(--blue);font-weight:600}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 4px);right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:30;min-width:220px;padding:6px;max-height:70vh;overflow:auto}
.menu.left{left:0;right:auto}
.menu .it{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px}
.menu .it:hover{background:var(--hover)}
.menu .it.on{color:var(--blue);font-weight:600}
.menu hr{border:none;border-top:1px solid var(--line2);margin:6px 0}
.menu label.it{cursor:pointer}
.menu .sub{font-size:11px;color:var(--ink3);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.04em}
.dates{display:flex;gap:6px;padding:6px 10px}
.dates input{border:1px solid var(--line);border-radius:6px;padding:4px 6px}

/* table */
.tablewrap{flex:1;overflow:auto;background:#fff;border:1px solid var(--line);border-top:none;min-height:0}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{padding:0 12px;height:44px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);text-align:right;white-space:nowrap;vertical-align:middle}
th{position:sticky;top:0;background:#f5f6f7;z-index:3;height:40px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none;font-size:12px}
th:hover{color:var(--ink)}
th .ar{font-size:9px;margin-left:3px;color:var(--blue)}
td.l,th.l{text-align:left}
.c-chk{width:40px;padding:0 0 0 12px;text-align:center;position:sticky;left:0;background:inherit;z-index:2}
.c-tog{width:56px;text-align:center;position:sticky;left:40px;background:inherit;z-index:2}
.c-name{min-width:300px;max-width:380px;text-align:left;position:sticky;left:96px;background:inherit;z-index:2;box-shadow:1px 0 0 var(--line)}
th.c-chk,th.c-tog,th.c-name{z-index:4;background:#f5f6f7}
tbody tr{background:#fff}
tbody tr:hover{background:var(--hover)}
tbody tr.sel{background:var(--sel)}
tbody tr.drafted{background:var(--draft)}
tbody tr.drafted td.c-name{box-shadow:inset 3px 0 0 var(--draftline),1px 0 0 var(--line)}
.nm{display:flex;align-items:center;gap:8px;min-width:0}
.nm img{width:32px;height:32px;border-radius:4px;object-fit:cover;flex:none;background:var(--line2)}
.nm .tx{min-width:0}
.nm a{color:var(--blue);text-decoration:none;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;max-width:300px;cursor:pointer}
.nm a:hover{text-decoration:underline}
.nm .cli{font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;max-width:300px}
.acts{display:none;gap:10px;font-size:11px;margin-top:2px}
tr:hover .acts{display:flex}
.acts span{color:var(--ink2);cursor:pointer}.acts span:hover{color:var(--blue)}
.st{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.dot.g{background:var(--green)}.dot.r{background:var(--red)}.dot.a{background:var(--amber)}
.muted{color:var(--ink3)}
.sub2{display:block;font-size:11px;color:var(--ink3)}
.dpill{display:inline-block;font-size:10px;font-weight:700;color:#8a5a00;background:#ffe9a8;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
tfoot td{position:sticky;bottom:0;background:#f5f6f7;font-weight:600;z-index:3;border-top:1px solid var(--line)}
tfoot td.c-chk,tfoot td.c-tog,tfoot td.c-name{z-index:4;background:#f5f6f7}

/* toggle */
.tg{width:36px;height:20px;border-radius:10px;background:#ccd0d5;position:relative;cursor:pointer;display:inline-block;transition:.15s;vertical-align:middle}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.15s}
.tg.on{background:var(--blue)}.tg.on::after{left:18px}
.tg.dis{opacity:.4;cursor:not-allowed}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue);cursor:pointer}

.edit{cursor:pointer;border-bottom:1px dashed transparent}
.edit:hover{border-bottom-color:var(--blue);color:var(--blue)}
.inl{width:90px;border:1px solid var(--blue);border-radius:4px;padding:3px 6px;text-align:right}
.inln{width:260px;text-align:left}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.mod{background:#fff;border-radius:10px;width:min(980px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.mod header{padding:16px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.mod header h2{margin:0;font-size:17px}
.mod .body{padding:12px 20px;overflow:auto;flex:1}
.mod footer{padding:12px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;align-items:center}
.chg{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.chg .h{display:flex;align-items:center;gap:10px;padding:10px 12px}
.chg .h .w{flex:1;min-width:0}
.chg .h b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chg .lv{font-size:11px;color:var(--ink3)}
.arrow{font-weight:600;white-space:nowrap}
.arrow s{color:var(--ink3);font-weight:400}
.state{font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;white-space:nowrap}
.state.draft{background:#ffe9a8;color:#8a5a00}.state.queued,.state.publishing{background:var(--blue2);color:var(--blue)}
.state.published{background:var(--green2);color:var(--green)}.state.error{background:var(--red2);color:var(--red)}
.prev{border-top:1px solid var(--line2);background:#f7f8fa;padding:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.prev iframe{border:none;width:340px;height:560px;background:#fff;border-radius:8px}
.prev .wait{color:var(--ink2);padding:20px}
.prev .seen{display:flex;gap:8px;align-items:center;font-weight:600}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.warn{background:var(--red2);color:#a3112a;border-radius:6px;padding:8px 10px;font-size:12px;margin:6px 0}
.note{background:var(--blue2);color:#0b4ea2;border-radius:6px;padding:8px 10px;font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c1e21;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;box-shadow:var(--shadow)}
.empty{padding:40px;text-align:center;color:var(--ink2)}
.err-acc{color:var(--red);font-size:11px}
.cards,.msort,.brk,#sheetBg,.sm-only{display:none}
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:29}
/* ---------- mobile (só abaixo de 760px; o PC fica igual) ---------- */
@media (max-width:760px){
  #app{height:100vh;height:100dvh}
  body{font-size:14px}
  input,select,.inl{font-size:16px!important}
  .lg{display:none}.sm-only{display:inline}
  .top{gap:8px;padding:0 10px;height:56px}
  .brand span{display:none}
  .acct{flex:1;min-width:0}
  .acctbtn{min-width:0;max-width:none;width:100%;padding:9px 10px}
  .acctbtn small,.sync,.top .spacer{display:none}
  .btn{min-height:40px}
  .main{padding:0}
  .tabs{border-radius:0;border-left:none;border-right:none;overflow-x:auto;scrollbar-width:none;flex:none}
  .tabs::-webkit-scrollbar,.pills::-webkit-scrollbar{display:none}
  .tab{flex:none;max-width:none;padding:12px 11px;font-size:13px;white-space:nowrap;gap:6px}
  .tab .chip{margin-left:6px}
  .bar{border-left:none;border-right:none;padding:8px 10px;gap:8px;flex:none}
  .search{order:0;flex:1 1 0;max-width:none;min-width:0;padding:8px 10px}
  .bar .dd{order:1;flex:none}
  .bar .dd>.btn{width:44px;padding:0;justify-content:center}
  .brk{display:block;order:2;flex-basis:100%;height:0}
  .pills{order:3;flex:1 1 0;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .pill{padding:7px 10px;font-size:13px;white-space:nowrap}
  .bar>.spacer{display:none}
  .msort{order:4;display:flex;gap:4px;flex:none;width:38%}
  .msort select{min-width:0;width:100%;border:1px solid var(--line);border-radius:6px;padding:0 8px;height:40px;background:#fff}
  .msort .btn{width:40px;padding:0;justify-content:center}
  .tablewrap{display:none}
  .cards{display:block;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 10px calc(20px + env(safe-area-inset-bottom))}
  .csum{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;color:var(--ink2);font-size:12px;margin:0 2px 10px}
  .csum b{color:var(--ink);font-size:13px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .card.drafted{background:var(--draft);border-color:var(--draftline)}
  .card.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
  .ch{display:flex;gap:10px;align-items:flex-start}
  .ch img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none;background:var(--line2)}
  .cm{flex:1;min-width:0}
  .cm a{color:var(--blue);font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;cursor:pointer}
  .cm .inln{width:100%}
  .cs{margin-top:4px;font-size:12px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
  .cs .sub2{display:inline;margin-left:4px}
  .ch .tg{flex:none;width:46px;height:28px;border-radius:14px;margin-top:2px}
  .ch .tg::after{width:24px;height:24px}.ch .tg.on::after{left:20px}
  .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line2)}
  .kv{display:flex;flex-direction:column;gap:2px;min-width:0}
  .kv .k{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kv .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
  .kv .v .sub2{font-weight:400}
  .more{margin-top:8px}
  .more summary{color:var(--blue);font-weight:500;font-size:13px;padding:8px 0;list-style:none;cursor:pointer}
  .more summary::-webkit-details-marker{display:none}
  .more[open] summary{color:var(--ink2)}
  .kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;padding:4px 0 2px}
  .kgrid .kv .v{font-size:14px}
  .cact{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
  .card .edit{border-bottom:1px dashed var(--line)}
  /* menus viram folha de baixo */
  .menu,.menu.left{position:fixed;left:0;right:0;top:auto;bottom:0;min-width:0;max-height:78vh;max-height:78dvh;border-radius:16px 16px 0 0;padding:8px 8px calc(14px + env(safe-area-inset-bottom));z-index:31}
  .menu::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 8px}
  .menu .it{min-height:46px;padding:10px 12px}
  .dates input{flex:1;min-width:0;padding:8px}
  body:has(.menu:not(.hide)) #sheetBg{display:block}
  /* Rever e publicar em ecrã inteiro */
  .ov{padding:0;align-items:stretch}
  .mod{width:100%;max-height:none;height:100vh;height:100dvh;border-radius:0}
  .mod header{padding:12px 14px}
  .mod .body{padding:10px 12px}
  .mod footer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));flex-wrap:wrap}
  .mod footer .warn,.mod footer>.muted{flex:1 1 100%}
  .chg .h{flex-wrap:wrap}.chg .h .w{flex:1 1 100%}
  .prev{padding:10px}.prev iframe{width:100%;max-width:380px;height:540px}
  .toast{bottom:calc(18px + env(safe-area-inset-bottom));max-width:calc(100vw - 32px)}
}
</style>
</head>
<body>
<div id="login" class="hide">
  <form id="lf">
    <h1>Gerenciador · Além da Métrica</h1>
    <p>Entre com a sua conta de administrador.</p>
    <input id="em" type="email" placeholder="E-mail" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Senha" autocomplete="current-password" required>
    <div class="err" id="lerr"></div>
    <button class="btn primary" style="width:100%;justify-content:center;padding:10px">Entrar</button>
  </form>
</div>

<div id="app" class="hide">
  <div class="top">
    <div class="brand"><i></i><span>Gerenciador</span></div>
    <div class="acct dd">
      <button class="acctbtn" id="acctBtn"><b id="acctName">Todos os clientes</b><small id="acctSub"></small><span class="caret"></span></button>
      <div class="menu left hide" id="acctMenu"></div>
    </div>
    <div class="spacer"></div>
    <span class="sync" id="sync"></span>
    <button class="btn" id="syncNow" title="Puxa de novo da Meta os últimos 7 dias">⟳ Sincronizar agora</button>
    <button class="btn green" id="pubBtn"><span class="lg">Rever e publicar</span><span class="sm-only">Publicar</span> <span class="badge" id="pubN">0</span></button>
  </div>

  <div class="main">
    <div class="tabs">
      <div class="tab" data-l="account"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="5.5" cy="5" r="2.5" fill="currentColor"/><path d="M1 14c0-2.6 2-4.5 4.5-4.5S10 11.4 10 14z" fill="currentColor"/><circle cx="11.5" cy="5.5" r="2" fill="currentColor" opacity=".5"/><path d="M9.6 9.6c.6-.3 1.2-.4 1.9-.4 2 0 3.5 1.6 3.5 3.8V14h-4" fill="currentColor" opacity=".5"/></svg><span class="lbl">Clientes</span><span class="chip hide" id="chip-account"></span></div>
      <div class="tab" data-l="campaign"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="3" rx="1" fill="currentColor"/><rect x="1" y="7" width="14" height="3" rx="1" fill="currentColor" opacity=".5"/><rect x="1" y="12" width="14" height="2" rx="1" fill="currentColor" opacity=".3"/></svg><span class="lbl">Campanhas</span><span class="chip hide" id="chip-campaign"></span></div>
      <div class="tab" data-l="adset"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1" fill="currentColor"/><rect x="9" y="1" width="6" height="6" rx="1" fill="currentColor" opacity=".5"/><rect x="1" y="9" width="6" height="6" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor" opacity=".3"/></svg><span class="lbl">Conjuntos<span class="lg"> de anúncios</span></span><span class="chip hide" id="chip-adset"></span></div>
      <div class="tab" data-l="ad"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="5.5" cy="6.5" r="1.5" fill="currentColor"/><path d="M2 13l4-4 3 3 2-2 4 3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="lbl">Anúncios</span><span class="chip hide" id="chip-ad"></span></div>
    </div>
    <div class="bar">
      <div class="search"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="#8a8d91" stroke-width="1.8"/><path d="M11 11l4 4" stroke="#8a8d91" stroke-width="1.8"/></svg><input id="q" placeholder="Pesquisar por nome"></div>
      <div class="brk"></div>
      <div class="pills" id="stPills">
        <span class="pill on" data-flt="delivery">Com veiculação</span>
        <span class="pill" data-flt="active">Ativos</span>
        <span class="pill" data-flt="all">Tudo</span>
      </div>
      <div class="msort"><select id="sortSel" aria-label="Ordenar"></select><button class="btn" id="sortDir" title="Inverter ordem">↓</button></div>
      <div class="spacer"></div>
      <div class="dd"><button class="btn" id="colBtn" title="Colunas">▥<span class="lg"> Colunas: <b id="colName">Desempenho</b></span></button><div class="menu hide" id="colMenu"></div></div>

async function pageAll(tbl,cols,mod){/* conta e puxa as páginas em paralelo (6 de cada vez) */
  let q0=S.sb.from(tbl).select(cols,{count:"exact"}).range(0,999);if(mod)q0=mod(q0);
  const{data:d0,count,error:e0}=await q0;if(e0)throw e0;let out=d0||[];const n=Math.ceil((count||0)/1000);
  for(let b=1;b<n;b+=6){const ps=[];for(let i=b;i<Math.min(n,b+6);i++){let q=S.sb.from(tbl).select(cols).range(i*1000,i*1000+999);if(mod)q=mod(q);ps.push(q)}
    for(const r of await Promise.all(ps)){if(r.error)throw r.error;out=out.concat(r.data)}}
  return out}

  for(const x of rows)S.reach[x.level+":"+x.entity_id]=x;

function acctBudget(acc){let t=0;const E=Object.values(S.ent);
  for(const c of E){if(c.level!=="campaign"||c.account_id!==acc||effStatus(c)!=="ACTIVE")continue;
    if(c.daily_budget){t+=+c.daily_budget;continue}
    for(const a of E)if(a.level==="adset"&&a.campaign_id===c.id&&effStatus(a)==="ACTIVE"&&a.daily_budget)t+=+a.daily_budget}
  return t}
function rows(){const by=aggregate(),lv=S.level,acc=Object.fromEntries(S.accounts.map(a=>[a.account_id,a]));const q=S.q.toLowerCase();
  const parentSel=lv==="adset"?S.sel.campaign:lv==="ad"?(S.sel.adset.size?S.sel.adset:S.sel.campaign):null;
  const parentKey=lv==="adset"?"campaign_id":lv==="ad"?(S.sel.adset.size?"adset_id":"campaign_id"):null;
  const out=[];
  const src=lv==="account"?S.accounts.map(acctEnt):Object.values(S.ent);
  for(const e of src){if(e.level!==lv)continue;
    if(lv!=="account"&&S.sel.account.size&&!S.sel.account.has(e.account_id))continue;if(S.acct!=="all"&&e.account_id!==S.acct)continue;
    if(["ARCHIVED","DELETED"].includes(e.effective_status)&&S.filter!=="all")continue;
    if(parentSel&&parentSel.size&&!parentSel.has(e[parentKey]))continue;
    if(q&&!(e.name||"").toLowerCase().includes(q)&&!(acc[e.account_id]?.client||"").toLowerCase().includes(q))continue;
    const m=by[lv][e.id]||{};const r={level:lv,_e:e,id:e.id,cur:acc[e.account_id]?.currency||"EUR",client:acc[e.account_id]?.client||e.account_id,results:0};
    for(const k of MET)r[k]=m[k]||0;r.results=m.rtypes&&m.rtypes.size>1?null:(m.results||0);r.rtype=m.rtypes&&m.rtypes.size===1?[...m.rtypes][0]:(m.rtypes||lv==="account"?null:rtype(lv==="adset"?e.id:lv==="ad"?e.adset_id:Object.values(S.ent).find(x=>x.level==="adset"&&x.campaign_id===e.id)?.id,{}));
    if(!S.demo){const x=S.reach&&S.reach[lv+":"+e.id];r.reach=x?+x.reach:(r.impressions>0?null:0)}r._st=effStatus(e)==="ACTIVE"?0:1;r._budget=e.daily_budget||e.lifetime_budget;r._created=e.created_time;r._end=e.stop_time?new Date(e.stop_time):null;
    if(lv==="account"){const a=e._a;r._budget=acctBudget(e.account_id);r._st=a.error?2:e._active?0:1;r._nact=e._active;
      if(S.filter==="delivery"&&!(r.impressions>0||e._active))continue;if(S.filter==="active"&&!e._active)continue;out.push(r);continue}
    if(S.filter==="delivery"&&!(r.impressions>0||e.effective_status==="ACTIVE"&&!(r._end&&r._end<new Date())||draftOf(e.id,"status")))continue;
    if(S.filter==="active"&&effStatus(e)!=="ACTIVE")continue;
    out.push(r)}
  const c=COLS[S.sort.k];const key=S.sort.k==="name"?(r=>(r._e.name||"").toLowerCase()):S.sort.k==="client"?(r=>r.client.toLowerCase()):(r=>{const v=c?c.v(r):0;return v==null?-Infinity:v});
  out.sort((a,b)=>{const x=key(a),y=key(b);return(x>y?1:x<y?-1:0)*S.sort.d});return out}

function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
async function setDraft(e,field,oldV,newV){
  const ex=S.drafts.find(d=>d.entity_id===e.id&&d.field===field&&["draft","error"].includes(d.state));
  const acc=S.accounts.find(a=>a.account_id===e.account_id);
  if(String(newV)===String(oldV)){if(ex){if(!S.demo)await S.sb.from("ads_drafts").delete().eq("id",ex.id);S.drafts=S.drafts.filter(d=>d!==ex)}render();return}
  if(ex){ex.new_value=String(newV);ex.state="draft";ex.preview_seen=false;if(!S.demo){const{error}=await S.sb.from("ads_drafts").update({new_value:String(newV),state:"draft",preview_seen:false,preview_html:null,result:null}).eq("id",ex.id);if(error)return toast(error.message)}ex.preview_html=null}
  else{const d={account_id:e.account_id,entity_id:e.id,entity_level:e.level,entity_name:e.name,client:acc?.client,field,old_value:oldV==null?null:String(oldV),new_value:String(newV),state:"draft"};
    if(S.demo){d.id="demo"+Math.random();S.drafts.push(d)}else{const{data,error}=await S.sb.from("ads_drafts").insert(d).select().single();if(error)return toast(error.message);S.drafts.push(data)}}
  render();toast("Guardado como rascunho. Publique em \"Rever e publicar\".")}

  return /^https:\/\/(business|www)\.facebook\.com\//.test(u)?`<iframe src="${esc(u)}" scrolling="yes"></iframe>`:`<div class="wait">${esc((h||"").replace(/<[^>]+>/g,""))||"Sem prévia"}</div>`}
function agoTxt(t){const m=Math.round((Date.now()-new Date(t))/60000);return m<1?"agora mesmo":m<60?"há "+m+" min":m<1440?"há "+Math.floor(m/60)+" h "+(m%60)+" min":"há "+Math.floor(m/1440)+" dia(s)"}
function showAgo(){const el=$("#sync");if(!el||S.syncing)return;const a=S.accounts.find(x=>x.account_id===S.acct);const ls=a?a.last_sync:S.accounts.map(x=>x.last_sync).filter(Boolean).sort().pop();el.textContent=ls?"Atualizado "+agoTxt(ls):""}

async function syncNow(){if(S.demo||S.syncing){toast(S.syncing?"Já está a sincronizar":"Modo demo");return}
  const b=$("#syncNow");S.syncing=true;b.disabled=true;$("#sync").textContent="A pedir à Meta…";
  try{const {data,error}=await S.sb.from("ads_sync_req").insert({account_id:S.acct||"all"}).select().single();if(error)throw error;
    const t0=Date.now();
    while(Date.now()-t0<600000){await new Promise(r=>setTimeout(r,5000));
      const {data:r}=await S.sb.from("ads_sync_req").select("result").eq("id",data.id).single();
      $("#sync").textContent=r&&r.result==="a sincronizar"?"A sincronizar com a Meta…":"Na fila…";

    toast("A sincronização está a demorar; os dados aparecem quando terminar")}
  catch(e){toast("Erro: "+(e.message||e))}finally{S.syncing=false;b.disabled=false;showAgo()}}

        <div class="thumbs">${ads.slice(0,24).map(a=>`<img src="${esc(a.thumb||"")}" title="${esc(a.name)}" alt="">`).join("")||'<span class="muted">Nenhum anúncio ativo dentro.</span>'}</div>
        <label class="seen" style="margin-top:10px"><input type="checkbox" data-seen="${d.id}" ${d.preview_seen?"checked":""}> Revi os anúncios</label></div></div>`}}
    return`<div class="chg"><div class="h"><div class="w"><b>${esc(d.entity_name||d.entity_id)}</b><span class="lv">${LV[d.entity_level]} · ${esc(d.client||"")} · ${FL[d.field]}</span></div>
      <span class="arrow"><s>${val(d,d.old_value)}</s> → ${val(d,d.new_value)}</span><span class="state ${d.state}">${{draft:"Rascunho",queued:"Na fila",publishing:"A publicar",published:"Publicado",error:"Erro"}[d.state]}</span>
      ${["draft","error"].includes(d.state)?`<button class="btn ghost" data-disc="${d.id}" title="Descartar">✕</button>`:""}</div>
      ${d.state==="error"?`<div class="warn" style="margin:0 12px 10px">${esc(d.result)}</div>`:""}${prev}</div>`}).join(""):`<div class="empty">Sem alterações em rascunho.</div>`;
  const pend=ds.filter(d=>["draft","error"].includes(d.state)),blocked=pend.filter(d=>needPrev(d)&&!d.preview_seen).length;
  $("#modal").innerHTML=`<div class="ov" id="ov"><div class="mod"><header><h2>Rever e publicar</h2><span class="muted">${pend.length} alteração(ões) por publicar</span><div class="spacer"></div><button class="btn ghost" id="mClose">✕</button></header>
    <div class="body">${body}</div><footer>${blocked?`<span class="warn" style="margin:0">Falta ver ${blocked} prévia(s) antes de publicar.</span>`:'<span class="muted">As alterações vão para a Meta pelo servidor. Nada é publicado sem este botão.</span>'}<div class="spacer"></div>
    ${pend.length?`<button class="btn" id="mDiscAll">Descartar tudo</button>`:""}<button class="btn green" id="mPub" ${!pend.length||blocked?"disabled":""}>Publicar ${pend.length||""}</button></footer></div></div>`}

async function publish(){const pend=S.drafts.filter(d=>["draft","error"].includes(d.state));
  $("#modal .mod footer").innerHTML=`<b>Publicar ${pend.length} alteração(ões) na Meta?</b><div class="spacer"></div><button class="btn" id="mCancel">Voltar</button><button class="btn green" id="mGo">Sim, publicar</button>`}
async function publishGo(){const pend=S.drafts.filter(d=>["draft","error"].includes(d.state));
  if(S.demo){pend.forEach(d=>d.state="published");review();render();return}
  const{error}=await S.sb.from("ads_drafts").update({state:"queued"}).in("id",pend.map(d=>d.id));if(error){toast(error.message);return}
  pend.forEach(d=>d.state="queued");review();render();poll()}
let pollT=null;async function poll(){clearTimeout(pollT);await loadDrafts();
  const busy=S.drafts.some(d=>["queued","publishing"].includes(d.state)||(d.state==="draft"&&d.field==="status"&&d.new_value==="ACTIVE"&&d.entity_level==="ad"&&!d.preview_html));
  if(S.drafts.some(d=>d.state==="published"&&!d._seen)){S.drafts.filter(d=>d.state==="published").forEach(d=>d._seen=1);await loadAll()}
  render();if($("#ov"))review();if(busy)pollT=setTimeout(poll,4000)}

/* ---------- eventos ---------- */
document.addEventListener("click",async ev=>{const t=ev.target;
  if(t.closest("#acctBtn")){const m=$("#acctMenu"),h=m.classList.contains("hide");closeMenus();if(h){acctMenu();m.classList.remove("hide")}return}
  if(t.closest("#colBtn")){const m=$("#colMenu"),h=m.classList.contains("hide");closeMenus();if(h){colMenu();m.classList.remove("hide")}return}
  if(t.closest("#dateBtn")){const m=$("#dateMenu"),h=m.classList.contains("hide");closeMenus();if(h){dateMenu();m.classList.remove("hide")}return}
  const a=t.closest("[data-a]");if(a){S.acct=a.dataset.a;LS.set("acct",S.acct);for(const k in S.sel)S.sel[k].clear();closeMenus();await refreshDaily();return}
  const c=t.closest("[data-c]");if(c){S.cols=c.dataset.c;LS.set("cols",S.cols);closeMenus();render();return}
  const p=t.closest("[data-p]");if(p){S.preset=p.dataset.p;LS.set("preset",S.preset);closeMenus();await refreshDaily();return}
  if(t.id==="dApply"){S.since=$("#d1").value;S.until=$("#d2").value;if(S.since>S.until)[S.since,S.until]=[S.until,S.since];S.preset="custom";closeMenus();await refreshDaily();return}
  if(!t.closest(".menu"))closeMenus();
  const tab=t.closest(".tab");if(tab&&!t.closest("[data-clr]")){S.level=tab.dataset.l;LS.set("level",S.level);render();return}
  const clr=t.closest("[data-clr]");if(clr){S.sel[clr.dataset.clr].clear();render();return}
  const pl=t.closest("[data-flt]");if(pl){S.filter=pl.dataset.flt;LS.set("filter",S.filter);render();return}
  const th=t.closest("th[data-s]");if(th){const k=th.dataset.s;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:k==="name"||k==="client"?1:-1};LS.set("sort",S.sort);render();return}
  if(t.id==="chkAll"){const R=rows(),sel=S.sel[S.level];if(t.checked)R.forEach(r=>sel.add(r.id));else sel.clear();render();return}
  const ck=t.closest("[data-chk]");if(ck){const s=S.sel[S.level],id=ck.dataset.chk;s.has(id)?s.delete(id):s.add(id);render();return}
  const dn=t.closest("[data-drill]")||t.closest("a[data-name]");if(dn&&S.level!=="ad"){const id=dn.dataset.drill||dn.dataset.name;S.sel[S.level]=new Set([id]);
    if(S.level==="account"){S.sel.campaign.clear();S.sel.adset.clear()}if(S.level==="campaign")S.sel.adset.clear();S.level={account:"campaign",campaign:"adset",adset:"ad"}[S.level];LS.set("level",S.level);render();$("#tw").scrollTop=0;$("#cards").scrollTop=0;return}
  const cp=t.closest("[data-copy]");if(cp){try{await navigator.clipboard.writeText(cp.dataset.copy);toast("ID copiado")}catch(e){toast(cp.dataset.copy)}return}
  const tg=t.closest("[data-tog]");if(tg&&!tg.classList.contains("dis")){const e=S.ent[tg.dataset.tog];const cur=effStatus(e);await setDraft(e,"status",e.status,cur==="ACTIVE"?"PAUSED":"ACTIVE");return}
  const bd=t.closest("[data-bud]");if(bd&&!bd.querySelector("input")){const e=S.ent[bd.dataset.bud],f=bd.dataset.f;const d=draftOf(e.id,f);const v=d?+d.new_value:e[f];
    bd.innerHTML=`<input class="inl" type="number" step="0.01" min="1" value="${v}">`;const i=bd.querySelector("input");i.focus();i.select();
    const done=async ok=>{const nv=Math.round(parseFloat(i.value)*100)/100;if(ok&&nv>0)await setDraft(e,f,e[f],nv);else render()};
    i.addEventListener("keydown",k=>{if(k.key==="Enter")done(true);if(k.key==="Escape")done(false)});i.addEventListener("blur",()=>done(true));return}
  const rn=t.closest("[data-ren]");if(rn){const e=S.ent[rn.dataset.ren];const a2=t.closest("tr,.card").querySelector("a[data-name]");const d=draftOf(e.id,"name");
    a2.outerHTML=`<input class="inl inln" value="${esc(d?d.new_value:e.name)}">`;const i=t.closest("tr,.card").querySelector(".inln");i.focus();
    const done=async ok=>{const nv=i.value.trim();if(ok&&nv)await setDraft(e,"name",e.name,nv);else render()};
    i.addEventListener("keydown",k=>{if(k.key==="Enter")done(true);if(k.key==="Escape")done(false)});i.addEventListener("blur",()=>done(true));return}
  if(t.closest("#pubBtn")){review();poll();return}
  if(t.id==="mClose"||t.id==="ov"){$("#modal").innerHTML="";return}
  const ds=t.closest("[data-disc]");if(ds){const d=S.drafts.find(x=>String(x.id)===ds.dataset.disc);if(!S.demo)await S.sb.from("ads_drafts").delete().eq("id",d.id);S.drafts=S.drafts.filter(x=>x!==d);review();render();return}
  if(t.id==="mDiscAll"){const pend=S.drafts.filter(d=>["draft","error"].includes(d.state));if(!S.demo)await S.sb.from("ads_drafts").delete().in("id",pend.map(d=>d.id));S.drafts=S.drafts.filter(d=>!pend.includes(d));review();render();return}
  if(t.id==="mPub"){publish();return}if(t.id==="mCancel"){review();return}if(t.id==="mGo"){await publishGo();return}
  if(t.id==="sortDir"){S.sort={k:S.sort.k,d:-S.sort.d};LS.set("sort",S.sort);render();return}
  if(t.closest&&t.closest("#syncNow")){syncNow();return}
});
document.addEventListener("change",async ev=>{const t=ev.target;
  if(t.id==="sortSel"){const k=t.value;S.sort={k,d:k==="name"||k==="client"?1:-1};LS.set("sort",S.sort);render();return}
  if(t.dataset.cc){let cl=[...colList()];if(t.checked){if(!cl.includes(t.dataset.cc))cl.push(t.dataset.cc)}else cl=cl.filter(x=>x!==t.dataset.cc);
    S.custom=cl;S.cols="custom";LS.set("custom",cl);LS.set("cols","custom");render();return}
  if(t.dataset.seen){const d=S.drafts.find(x=>String(x.id)===t.dataset.seen);d.preview_seen=t.checked;if(!S.demo){const{error}=await S.sb.from("ads_drafts").update({preview_seen:t.checked}).eq("id",d.id);if(error)toast(error.message)}review();return}
});
let qT;$("#q").addEventListener("input",e=>{clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value.trim();render()},150)});
async function refreshDaily(){if(!S.demo){$("#sync").textContent="A carregar…";await loadDaily()}render()}

/* ---------- arranque ---------- */
async function start(){$("#login").classList.add("hide");$("#app").classList.remove("hide");
  try{await loadAll()}catch(e){toast("Erro a carregar: "+e.message)}
  if(!S.demo&&!S.accounts.length){$("#tw").innerHTML=`<div class="empty">Esta conta não é administradora ou ainda não há dados.</div>`;return}
  if(S.acct!=="all"&&!S.accounts.find(a=>a.account_id===S.acct))S.acct="all";render();poll()}
(async()=>{
  if(S.demo){start();return}
  S.sb=supabase.createClient(CFG.url,CFG.key);
  const{data:{session}}=await S.sb.auth.getSession();if(session)return start();
  $("#login").classList.remove("hide");
  $("#lf").addEventListener("submit",async ev=>{ev.preventDefault();$("#lerr").textContent="";
    const{error}=await S.sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    if(error){$("#lerr").textContent="E-mail ou senha errados.";return}start()});
})();
</script>
</body>
</html>
